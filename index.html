<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>polyhedronisme</title>
    <style> 
    body { background: #f0f0e5; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 style="text-align:center;">
        <span class="fadey">poly</span>H&eacute;d<span class="fadey">r</span>onisme<span style="font-size:10px;">v0.3</span>
      </h2>

      <div class="canvaswrapper clearfix">
        <canvas id="poly" width="700" height="500"></canvas>
      </div>
      
      <div class="controlswrapper">
        <img id="fitscreen" src="static/fitscreen.svg" style="vertical-align:middle;" title="Center and fit to screen">
        <span style="width:100px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>

        <img id="strokeonly"  src="static/strokeonly.svg"  style="vertical-align:middle;" title="Edges only (wireframe)">
        <img id="fillonly"  src="static/fillonly.svg"  style="vertical-align:middle;" title="Faces only">
        <img id="fillandstroke"  src="static/fillandstroke.svg" style="vertical-align:middle;" title="Edges and faces">
        <span style="width:100px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
      
        <img id="frontrot" src="static/frontrot.svg" style="vertical-align:middle;" title="Front rotation">
        <img id="siderot"  src="static/siderot.svg"  style="vertical-align:middle;" title="Side rotation">
        <img id="toprot"   src="static/toprot.svg"   style="vertical-align:middle;" title="Top rotation">
        <span style="width:100px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
      
        <span id="pngsavebutton" style="font-size:12px;cursor:pointer;" title="Export as PNG image">PNG</span>
        <span id="svgsavebutton" style="font-size:12px;cursor:pointer;" title="Export as SVG vector image">SVG</span>
        <span id="objsavebutton" style="font-size:12px;cursor:pointer;" title="Export as OBJ geometry">OBJ</span>
        <span id="x3dsavebutton" style="font-size:12px;cursor:pointer;" title="Export as VRML2 model">VRML2</span>
      
      <p class="centered"><i>rotate by dragging on polyhedron, rescale by scrolling over canvas</i><br>
      </div>
      
      <div class="specwrapper">
        <div class="spec-row">
          <label for="spec">recipe</label>
          <input id="spec"></input>
          <a id="link" href="#" title="Copy this URL to share">&#x1F517;&#xFE0E;</a>
        </div>
        <div class="palette-row">
          <label for="palette-preset">palette</label>
          <select id="palette-preset" class="palette-select" title="Choose a preset color palette"></select>
          <div id="palette-swatches" class="palette-swatches"></div>
          <div class="palette-step-group">
            <button type="button" id="remove-color" class="swatch-step-btn" title="Remove last color slot">&minus;</button>
            <button type="button" id="add-color" class="swatch-step-btn" title="Add color slot">+</button>
          </div>
          <span id="shufflecolors" class="textbutton" title="Shuffle palette order">SHUFFLE</span>
          <span id="rndcolors" class="textbutton" title="Generate harmonic random palette">RANDOM</span>
          <span id="togglehex" class="textbutton" title="Toggle hex color input">HEX</span>
        </div>
        <div id="palette-hex-row" class="palette-hex-row" hidden>
          <input id="palette" spellcheck="false" placeholder="#ff7777 #dddddd #889999 ..."></input>
        </div>
      </div>
            
      <div class="statswrapper">
        <div id="statsinner">
          <div id="basicstats"></div>
        </div>
      </div>

      <div id="docs"></div>

      <div class="footer">
        Text &amp; Figures CC-BY | Code MIT License | <a href="http://anselmlevskaya.com">Anselm Levskaya</a> 2026
      </div>
      
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
